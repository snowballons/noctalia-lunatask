id = "snowballons/lunatask"
name = "Lunatask"
version = "0.1.0"
plugin_api   = 24                       # argv runAsync for data-dir hardening (M7)
author = "snowballons"
license = "MIT"
icon = "checklist"
description = "Create, edit and delete Lunatask tasks and notes, and add journal entries, from Noctalia."
tags = ["productivity"]
dependencies = ["chmod"]               # M7: owner-only data dir via argv runAsync

# ───────────── Plugin-level settings (seeded into every entry) ─────────────

[[setting]]
key = "token"
type = "string"
label_key = "settings.token.label"
description_key = "settings.token.description"
default = ""

[[setting]]
key = "token_file"
type = "file"
label_key = "settings.token_file.label"
description_key = "settings.token_file.description"
default = ""

[[setting]]
key = "areas"
type = "string_map"
label_key = "settings.areas.label"
description_key = "settings.areas.description"
default = {}

[[setting]]
key = "default_area"
type = "string"
label_key = "settings.default_area.label"
description_key = "settings.default_area.description"
default = ""

[[setting]]
key = "notebooks"
type = "string_map"
label_key = "settings.notebooks.label"
description_key = "settings.notebooks.description"
default = {}

[[setting]]
key = "default_notebook"
type = "string"
label_key = "settings.default_notebook.label"
description_key = "settings.default_notebook.description"
default = ""

[[setting]]
key = "default_task_status"
type = "select"
label_key = "settings.default_task_status.label"
default = "later"
options = [
  { value = "later", label_key = "status.later" },
  { value = "next", label_key = "status.next" },
  { value = "started", label_key = "status.started" },
  { value = "waiting", label_key = "status.waiting" },
]

[[setting]]
key = "cache_bodies"
type = "bool"
label_key = "settings.cache_bodies.label"
description_key = "settings.cache_bodies.description"
default = false

[[setting]]
key = "confirm_delete"
type = "bool"
label_key = "settings.confirm_delete.label"
default = true

[[setting]]
key = "source_tag"
type = "string"
label_key = "settings.source_tag.label"
description_key = "settings.source_tag.description"
default = "noctalia"
advanced = true

[[setting]]
key = "max_retries"
type = "int"
label_key = "settings.max_retries.label"
default = 1
min = 0
max = 3
advanced = true

# ───────────── Entries ─────────────

[[service]]
id = "core"
entry = "service.luau"

[[panel]]
id = "manager"
entry = "panel.luau"
width = 560
height = 680
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
dismiss_on_outside_click = false

[[launcher_provider]]
id = "capture"
entry = "launcher.luau"
prefix = "lt"
glyph = "checklist"
include_in_global_search = false

[[widget]]
id = "button"
entry = "widget.luau"
